<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 256 256"
   width="256"
   height="256"
   version="1.1"
   id="svg1"
   sodipodi:docname="ccin_icon.svg"
   inkscape:version="1.4.3 (0d15f75, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   data-symmetry="mirror">
  <!-- CCIN のアイコン。

       ■ 構造
       目と口の 4 つは「白い図形」ではなく **本体に開いた穴**（色抜き）。
       mask の中で黒く塗った場所が、本体から抜ける。白い場所が残る。
         ・mask "face-holes" … 全面が白（＝残す）＋ 穴にしたい 4 つが黒
         ・g "body"          … コーラルの 3 つ。mask を掛けて穴が開く
       穴の形を変えるときは mask の中の図形を編集する。色（黒）は変えないこと。

       ■ 左右対称（軸は x = 128）
         ・単体の要素 … 中心 x を 128 にする
         ・対の要素   … 左の中心 x と右の中心 x を足して 256 にする
       ルートの data-symmetry="mirror" がある間は、仕上げに左半分を折り返して
       画素まで揃える。わざと非対称にするときはこの属性を消すこと。

       ■ 編集したら
       ccin/tools/make-icon を実行して png と ico を作り直す。 -->
  <defs
     id="defs1">
    <mask
       id="face-holes"
       maskUnits="userSpaceOnUse">
      <!-- 白 = 残す。この 1 枚が本体ぜんぶを通す -->
      <rect
         id="mask-keep"
         x="0"
         y="0"
         width="256"
         height="256"
         fill="#ffffff" />
      <!-- 黒 = 抜く。ここから下が穴になる 4 つ -->
      <path
         id="path5"
         fill="#000000"
         d="m 73.273792,124.32632 c -14.157744,-0.31073 -25.51668,19.3688 -25.516487,43.21725 1.822305,0.022 4.079894,0.0561 6.62443,0.0994 0.85182,-21.09651 9.151437,-37.862 19.380577,-37.55719 10.241689,0.30546 18.515625,17.19693 19.041556,38.34192 3.746404,0.083 6.104327,0.13611 6.104327,0.13611 0.12771,-19.38498 -8.899791,-43.87085 -25.634403,-44.23751 z" />
      <path
         id="path5-6"
         fill="#000000"
         d="m 182.726208,124.32632 c 14.157744,-0.31073 25.51668,19.3688 25.516487,43.21725 -1.822305,0.022 -4.079894,0.0561 -6.62443,0.0994 -0.85182,-21.09651 -9.151437,-37.862 -19.380577,-37.55719 -10.241689,0.30546 -18.515625,17.19693 -19.041556,38.34192 -3.746404,0.083 -6.104327,0.13611 -6.104327,0.13611 -0.12771,-19.38498 8.899791,-43.87085 25.634403,-44.23751 z" />
      <ellipse
         id="path6"
         fill="#000000"
         cx="46.83776"
         cy="199.93486"
         rx="11.73462"
         ry="6.176116" />
      <ellipse
         id="path6-5"
         fill="#000000"
         cx="209.16224"
         cy="199.93486"
         rx="11.73462"
         ry="6.176116" />
    </mask>
  </defs>
  <g
     id="body"
     mask="url(#face-holes)">
    <rect
       x="10.06089"
       y="86.215927"
       width="235.87822"
       height="140.45721"
       rx="0"
       ry="40.538734"
       fill="#d97757"
       id="rect1-8"
       style="display:inline;stroke-width:0.831174" />
    <rect
       style="fill:#d97757;fill-opacity:1;stroke-linecap:square;stroke-linejoin:round"
       id="rect2"
       width="14.205067"
       height="27.17491"
       x="120.8974665"
       y="63.674305"
       ry="0.025836345" />
    <circle
       style="fill:#d97757;fill-opacity:1;stroke-linecap:square;stroke-linejoin:round"
       id="path2"
       cx="128"
       cy="47.336548"
       r="25.63088" />
  </g>
</svg>
